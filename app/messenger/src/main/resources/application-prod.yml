# prod용. SPRING_PROFILES_ACTIVE=prod 일 때만 로드됩니다.
# application.yml은 그대로 두고, 여기서 달라지는 key만 덮어씁니다.
#
# 기본값을 두지 않았습니다

# Cloudflare -> Caddy -> 컨테이너. /ws 핸드셰이크의 Origin 검사와 로깅이
# 원래 클라이언트 정보를 보도록 X-Forwarded-* 를 신뢰합니다.
server:
  forward-headers-strategy: framework

spring:
  # 컨테이너 이름 + native 포트. 호스트 포워딩 포트(82xx)가 아닙니다.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    # 운영 로그에 쿼리와 파라미터가 남지 않도록 끕니다.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  # Cloudflare Workers 오리진(https://hasi-collab.com).
  # REST(SecurityConfig)와 /ws 핸드셰이크(WebSocketConfig)가 같은 값을 씁니다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  internal:
    jwt:
      secret: ${INTERNAL_JWT_SECRET}
      issuer: ${INTERNAL_JWT_ISSUER:hasi-service}

  # RabbitMQ STOMP relay — infra 네트워크상의 컨테이너 이름 + native 포트.
  broker:
    relay-host: ${RABBITMQ_HOST}
    relay-port: ${RABBITMQ_STOMP_PORT:61613}
    # 공용 브로커를 다른 프로젝트와 공유하므로 전용 vhost가 필수입니다.
    # default 두지 않았습니다
    virtual-host: ${RABBITMQ_VHOST}
    login: ${RABBITMQ_USER}
    passcode: ${RABBITMQ_PASSWORD}

# service와 동일한 시크릿이어야 합니다.
jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.hasi.messenger: INFO
