# prod용. SPRING_PROFILES_ACTIVE=prod 일 때만 로드됩니다.
# application.yml은 그대로 두고, 여기서 달라지는 key만 덮어씁니다.
#
# 기본값을 두지 않았습니다

spring:
  # 컨테이너 이름 + native 포트. 호스트 포워딩 포트(82xx)가 아닙니다.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    # 운영 로그에 쿼리와 파라미터가 남지 않도록 끕니다.
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  # Cloudflare Pages 오리진. 프리뷰 배포까지 허용하려면 와일드카드 패턴 사용.
  # 예: https://hasi-collab.pages.dev,https://*.hasi-collab.pages.dev
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  internal:
    jwt:
      secret: ${INTERNAL_JWT_SECRET}
      issuer: ${INTERNAL_JWT_ISSUER:hasi-service}

  # RabbitMQ STOMP relay — infra 네트워크상의 컨테이너 이름 + native 포트.
  broker:
    relay-host: ${RABBITMQ_HOST}
    relay-port: ${RABBITMQ_STOMP_PORT:61613}
    login: ${RABBITMQ_USER}
    passcode: ${RABBITMQ_PASSWORD}

# service와 동일한 시크릿이어야 합니다.
jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    com.hasi.messenger: INFO
