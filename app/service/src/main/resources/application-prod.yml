# prod용. SPRING_PROFILES_ACTIVE=prod 일 때만 로드됩니다.
# application.yml은 그대로 두고, 여기서 달라지는 key만 덮어씁니다.
#
# 기본값을 두지 않았습니다
#
# OAuth client-id/secret, MAIL_*, NCP_* 는 application.yml에서 이미
# 환경변수로 주입되므로 여기에 다시 쓰지 않습니다.

# Cloudflare -> Caddy -> 컨테이너 구조라 요청이 http로 도착합니다.
server:
  forward-headers-strategy: framework

spring:
  # 컨테이너 이름 + native 포트. 호스트 포워딩 포트(82xx)가 아닙니다.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    # 운영 로그에 쿼리/파라미터가 남지 않도록 끕니다.
    show-sql: false

# 개발용 하드코딩 시크릿(application.yml)을 반드시 덮어씁니다.
jwt:
  secret: ${JWT_SECRET}

app:
  internal:
    jwt:
      # messenger의 같은 값과 반드시 일치해야 합니다.
      secret: ${INTERNAL_JWT_SECRET}
      issuer: ${INTERNAL_JWT_ISSUER:hasi-service}

  messenger:
    # 같은 infra 네트워크상의 컨테이너 이름.
    base-url: ${MESSENGER_BASE_URL:http://hasi-messenger:8081}

  # Cloudflare Workers 오리진(https://hasi-collab.com). 값 변경은 코드가 아니라
  # .env.prod의 CORS_ALLOWED_ORIGINS에서 합니다 — 패턴 방식이라 와일드카드도 됩니다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  # OAuth 로그인 성공 후 리다이렉트할 프론트엔드 주소(https://hasi-collab.com).
  # api.hasi-collab.com이 아니라 앱 오리진이어야 합니다.
  frontend:
    base-url: ${FRONTEND_BASE_URL}

# 공개 VPS에 API 문서를 노출하지 않습니다. 팀 내부에서 필요하면 true로.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 개발 프로필의 security DEBUG는 토큰/인증 상세가 로그에 남으므로 낮춥니다.
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.web.client: WARN
    com.hasi.service: INFO
