server:
  port: 8080

springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

# 테스트용 하드코딩 JWT.
jwt:
  secret: 1234567890987654323456789087654323456789
  access-token-expiry: 3600
  refresh-token-expiry: 604800

spring:
  datasource:
    url: jdbc:postgresql://localhost:8200/collaboration_db
    username: hasi
    password: hasi1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 아래는 기능 개발 시 주석 풀어서 사용 (Ctrl + /)

  data:
    redis:
      host: localhost
      port: 8201

