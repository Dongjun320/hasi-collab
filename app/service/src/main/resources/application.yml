server:
  port: 8080

springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

# 테스트용 하드코딩 JWT.
jwt:
  secret: 1234567890987654323456789087654323456789
  access-token-expiry: 3600
  refresh-token-expiry: 604800

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:8200/collaboration_db
    username: hasi
    password: hasi1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 아래는 기능 개발 시 주석 풀어서 사용 (Ctrl + /)

  data:
    redis:
      host: localhost
      port: 8201

  security:
    oauth2:
      client:
        registration:

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

          line:
            client-id: ${LINE_CLIENT_ID}
            client-secret: ${LINE_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/line"
            scope: profile

          twitter:
            client-id: ${TWITTER_CLIENT_ID}
            client-secret: ${TWITTER_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/twitter"
            scope: tweet.read, users.read

          amazon:
            client-id: ${AMAZON_CLIENT_ID}
            client-secret: ${AMAZON_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/amazon"
            scope: profile

        provider:
          line:
            authorization-uri: https://access.line.me/oauth2/v2.1/authorize
            token-uri: https://api.line.me/oauth2/v2.1/token
            user-info-uri: https://api.line.me/v2/profile
            user-name-attribute: userId

          twitter:
            authorization-uri: https://twitter.com/i/oauth2/authorize
            token-uri: https://api.twitter.com/2/oauth2/token
            user-info-uri: https://api.twitter.com/2/users/me
            user-name-attribute: data

          amazon:
            authorization-uri: https://www.amazon.com/ap/oa
            token-uri: https://api.amazon.com/auth/o2/token
            user-info-uri: https://api.amazon.com/user/profile
            user-name-attribute: user_id

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.client: DEBUG

ncp:
  object-storage:
    endpoint: https://kr.object.ncloudstorage.com
    region: kr-standard
    bucket: ${NCP_BUCKET_NAME}
    access-key: ${NCP_ACCESS_KEY}
    secret-key: ${NCP_SECRET_KEY}
