<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- メールクライアントのダークモードによる色の反転を抑えます -->
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>HASI メールアドレス認証</title>
</head>
<!--
  메일 HTML 주의사항 (수정 시 지켜주세요)
   - 스타일은 반드시 inline. <style> 태그는 Gmail이 상당 부분 제거합니다.
   - 레이아웃은 flex/grid 대신 <table>. Outlook이 flex/grid를 지원하지 않습니다.
   - 배경색은 style과 bgcolor 속성을 함께 지정 (Outlook은 bgcolor만 봅니다).
   - {{CODE}} 자리에 인증번호를 치환해서 발송합니다.
-->
<body style="margin:0; padding:0; background-color:#F8FDF9;">

<!-- 外側の背景 -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       bgcolor="#F8FDF9" style="background-color:#F8FDF9; margin:0; padding:0;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <!-- 本文カード (600px) -->
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
             style="width:600px; max-width:100%; background-color:#FFFFFF;
                    border:1px solid #E8F8ED; border-radius:16px; overflow:hidden;">

        <!-- ヘッダー -->
        <tr>
          <td align="center" bgcolor="#5CC87A"
              style="background-color:#5CC87A;
                     background-image:linear-gradient(135deg, #A8E6B8 0%, #5CC87A 55%, #2E8B4F 100%);
                     padding:32px 24px;">
            <img src="https://hasi-collab.com/favicon.png" width="56" height="56" alt="HASI"
                 style="display:block; width:56px; height:56px; border:0; border-radius:14px;">
            <div style="height:12px; line-height:12px; font-size:12px;">&nbsp;</div>
            <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
                        font-size:22px; font-weight:700; color:#FFFFFF; letter-spacing:1px;">
              hasi-collab
            </div>
          </td>
        </tr>

        <!-- 本文 -->
        <tr>
          <td style="padding:36px 40px 8px 40px;
                     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;">

            <div style="font-size:20px; font-weight:700; color:#2C3E50; line-height:1.5;">
              メールアドレスの認証
            </div>

            <div style="height:12px; line-height:12px; font-size:12px;">&nbsp;</div>

            <div style="font-size:14px; color:#5a6b7b; line-height:1.8;">
              いつもご利用いただきありがとうございます。<br>
              下記の認証コードを入力すると、メールアドレスの認証が完了します。
            </div>

            <div style="height:24px; line-height:24px; font-size:24px;">&nbsp;</div>

            <!-- 認証コード -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#F0F9F4"
                    style="background-color:#F0F9F4; border:2px solid #A8E6B8;
                           border-radius:12px; padding:26px 16px;">
                  <div style="font-size:12px; font-weight:600; color:#2E8B4F; letter-spacing:2px;">
                    認証コード
                  </div>
                  <div style="height:10px; line-height:10px; font-size:10px;">&nbsp;</div>
                  <div style="font-family:'Courier New',Consolas,monospace;
                              font-size:38px; font-weight:700; color:#1E3A28;
                              letter-spacing:10px; line-height:1.2;">
                    {{CODE}}
                  </div>
                </td>
              </tr>
            </table>

            <div style="height:20px; line-height:20px; font-size:20px;">&nbsp;</div>

            <!-- 有効期限 -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td bgcolor="#FFFBEB" style="background-color:#FFFBEB; border-left:4px solid #FFE66D;
                                             border-radius:6px; padding:12px 16px;
                                             font-size:13px; color:#7a6a2f; line-height:1.7;">
                  この認証コードの有効期限は <strong style="color:#5a4c1a;">10分間</strong> です。
                </td>
              </tr>
            </table>

            <div style="height:24px; line-height:24px; font-size:24px;">&nbsp;</div>

            <div style="font-size:13px; color:#94a3a9; line-height:1.8;">
              お心当たりのない場合は、このメールを破棄してください。<br>
              アカウントには何の変更も発生しません。
            </div>

            <div style="height:32px; line-height:32px; font-size:32px;">&nbsp;</div>
          </td>
        </tr>

        <!-- フッター -->
        <tr>
          <td align="center" bgcolor="#F8FDF9"
              style="background-color:#F8FDF9; border-top:1px solid #E8F8ED; padding:20px 40px;
                     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
                     font-size:12px; color:#a9b6bd; line-height:1.6;">
            このメールは送信専用アドレスから配信されています。<br>
            &copy; hasi-collab
          </td>
        </tr>

      </table>
      <!-- /本文カード -->

    </td>
  </tr>
</table>

</body>
</html>
