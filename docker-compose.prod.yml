name: hasi-collab

# Prod용 공용 인프라는 VPS에서 전체적으로 관리할거고 /srv/vps-infra/infra에 따로 둘 예정입니다.
# 이건 Docker Compose는 별도 private 레포에 있음.
# 사용: docker compose -f docker-compose.prod.yml up -d --build
# 개발용 docker-compose.yml 은 그대로 두고 이 파일만 배포에 사용합니다.
#
# 전제:
#   docker network create infra
#   docker network create edge
#   /srv/vps-infra/infra 스택이 healthy 상태

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  edge:
    name: edge
    external: true
  infra:
    name: infra
    external: true

volumes:
  hasi_redis_data:

services:

  # 프로젝트 전용 Redis.
  hasi-redis:
    image: redis:8-alpine
    container_name: hasi-redis
    restart: unless-stopped
    logging: *default-logging
    # infra 에만 붙입니다. 웹에 노출되지 않으므로 edge 는 불필요합니다.
    networks: [infra]
    env_file: .env.prod
    command:
      - sh
      - -c
      - |
        test -n "$$REDIS_PASSWORD" || {
          echo "FATAL: REDIS_PASSWORD is empty — refusing to start an unauthenticated Redis" >&2
          exit 1
        }
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes \
          --maxmemory-policy noeviction
    volumes:
      - hasi_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  hasi-service:
    build:
      context: .
      dockerfile: app/service/Dockerfile
    image: hasi-service:latest
    container_name: hasi-service      # Caddyfile의 upstream 이름과 일치해야 합니다.
    restart: unless-stopped
    logging: *default-logging
    networks: [edge, infra]
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      hasi-messenger:
        condition: service_started
      hasi-redis:
        condition: service_healthy
    healthcheck:
      # actuator 의존성이 없어 TCP 연결만 확인합니다.
      # 런타임 이미지가 alpine(busybox)이라 bash가 없습니다 — nc 사용.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  hasi-messenger:
    build:
      context: .
      dockerfile: app/messenger/Dockerfile
    image: hasi-messenger:latest
    container_name: hasi-messenger    # Caddyfile의 /ws upstream 이름과 일치.
    restart: unless-stopped
    logging: *default-logging
    networks: [edge, infra]
    env_file: .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      hasi-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
