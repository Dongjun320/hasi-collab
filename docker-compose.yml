services:

  postgres:
    image: postgres:15-alpine
    container_name: hasi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collaboration_db
      POSTGRES_USER: hasi
      POSTGRES_PASSWORD: hasi1234
    ports:
      - "8200:5432"

  redis:
    image: redis:7-alpine
    container_name: hasi-redis
    restart: unless-stopped
    ports:
      - "8201:6379"

  rabbitMq:
    build:
      context: ./docker/rabbitmq
    image: hasi-rabbitmq:stomp
    container_name: rabbit-mq
    restart: no
    ports:
      - "8202:5672" # AMQP
      - "8203:15672" # 관리 UI
      - "8204:61613" # STOMP
    environment:
      # 테스트용 유저.
      RABBITMQ_DEFAULT_USER: "hasi"
      RABBITMQ_DEFAULT_PASS: "1234"
