components:
  schemas:
    LogInRequest:
      type: object
      required:
        - id
        - password
      description: "로그인 시 필요 정보"
      properties:
        id:
          type: string
          description: "ID"
        password:
          type: string
          description: "password"

    LogOutRequest:
      type: object
      required:
        - refreshToken
      description: "refreshToken을 Redis 블랙리스트에 등록 (TTL = 남은 만료 시간)"
      properties:
        refreshToken:
          type: string
          description: "Redis 블랙리스트에 등록할 Refresh 토큰"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      description: "회원가입 시 필요정보"
      properties:
        email:
          type: string
          description: "email"
        password:
          type: string
          description: "password"
        nickname:
          type: string
          description: "nickname"

