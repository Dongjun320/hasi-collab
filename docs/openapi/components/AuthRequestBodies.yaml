components:
  schemas:
    LogInRequest:
      type: object
      required:
        - email
        - password
      description: "로그인 시 필요 정보"
      properties:
        email:
          type: string
          description: "email"
        password:
          type: string
          description: "password"

    LogOutRequest:
      type: object
      required:
        - refreshToken
      description: "refreshToken을 Redis 블랙리스트에 등록 (TTL = 남은 만료 시간)"
      properties:
        refreshToken:
          type: string
          description: "Redis 블랙리스트에 등록할 Refresh 토큰"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      description: "회원가입 시 필요정보"
      properties:
        email:
          type: string
          description: "email"
        password:
          type: string
          description: "password"
        nickname:
          type: string
          description: "nickname"

    EmailSendRequest:
      type: object
      required:
        - email
      description: "이메일 인증코드 발송 요청"
      properties:
        email:
          type: string
          description: "인증코드를 받을 email"

    EmailVerifyRequest:
      type: object
      required:
        - email
        - code
      description: "이메일 인증코드 확인 요청"
      properties:
        email:
          type: string
          description: "email"
        code:
          type: string
          description: "발송된 인증코드"

