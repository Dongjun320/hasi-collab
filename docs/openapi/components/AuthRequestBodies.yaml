components:
  schemas:
    LogInRequest:
      type: object
      required:
        - email
        - password
      description: "로그인 시 필요 정보"
      properties:
        email:
          type: string
          description: "email"
        password:
          type: string
          description: "password"

    LogOutRequest:
      type: object
      required:
        - refreshToken
      description: "refreshToken을 Redis 블랙리스트에 등록 (TTL = 남은 만료 시간)"
      properties:
        refreshToken:
          type: string
          description: "Redis 블랙리스트에 등록할 Refresh 토큰"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      description: "회원가입 시 필요정보"
      properties:
        email:
          type: string
          description: "email"
        password:
          type: string
          description: "password"
        nickname:
          type: string
          description: "nickname"

    EmailSendRequest:
      type: object
      required:
        - email
      description: "이메일 인증코드 발송 요청"
      properties:
        email:
          type: string
          description: "인증코드를 받을 email"
          #여기 추가 했습니다.
        purpose:
          type: string
          enum: [register, reset]
          description: "발송 목적입니다, 생략시 register로 간주(register=회원가입, reset=비밀번호 재설정)"

    EmailVerifyRequest:
      type: object
      required:
        - email
        - code
      description: "이메일 인증코드 확인 요청"
      properties:
        email:
          type: string
          description: "email"
        code:
          type: string
          description: "발송된 인증코드"
    # 지환님 확인 부탁드려요 확인하고 주석 지우고 올려주시면 될거같아요
    PasswordResetRequest:
      type: object
      required:
        - email
        - newPassword
      description: "비밀번호 재설정 (password/verify로 코드 확인 완료 후 호출. code는 서버가 password:verified 플래그로 확인하므로 불필요)"
      properties:
        email:
          type: string
          description: "재설정하는 email 계정"
        code:
          type: string
          description: "발송된 인증코드"
        newPassword:
          type: string
          description: "새로운 비밀번호"

