components:
  schemas:
    LogInRequest:
      type: object
      required:
        - email
        - password
      description: "로그인 시 필요 정보"
      properties:
        email:
          type: string
          description: "email"
        password:
          type: string
          description: "password"

    LogOutRequest:
      type: object
      required:
        - refreshToken
      description: "refreshToken을 Redis 블랙리스트에 등록 (TTL = 남은 만료 시간)"
      properties:
        refreshToken:
          type: string
          description: "Redis 블랙리스트에 등록할 Refresh 토큰"

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      description: "회원가입 시 필요정보"
      properties:
        email:
          type: string
          description: "email"
        password:
          type: string
          description: "password"
        nickname:
          type: string
          description: "nickname"

    EmailSendRequest:
      type: object
      required:
        - email
      description: "이메일 인증코드 발송 요청"
      properties:
        email:
          type: string
          description: "인증코드를 받을 email"
          #여기 추가 했습니다.
        purpose:
          type: string
          enum: [REGISTER, RESET]
          description: "발송 목적입니다, 생략시 register로 간주(register=회원가입, reset=비밀번호 재설정)"

    EmailVerifyRequest:
      type: object
      required:
        - email
        - code
      description: "이메일 인증코드 확인 요청"
      properties:
        email:
          type: string
          description: "email"
        code:
          type: string
          description: "발송된 인증코드"

    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      description: "로그인 상태에서 비밀번호 변경 요청"
      properties:
        currentPassword:
          type: string
          description: "현재 비밀번호"
        newPassword:
          type: string
          description: "새 비밀번호"

    PasswordResetRequest:
      type: object
      required:
        - email
        - newPassword
      description: "비밀번호 재설정 (password/verify로 코드 확인 완료 후 호출. code는 서버가 password:verified 플래그로 확인하므로 불필요)"
      properties:
        email:
          type: string
          description: "재설정하는 email 계정"
        code:
          type: string
          description: "발송된 인증코드"
        newPassword:
          type: string
          description: "새로운 비밀번호"

    SocialAccountResponse:
      type: object
      description: "연동된 소셜 계정 정보 (계정당 1개, 미연동이면 data = null)"
      properties:
        provider:
          type: string
          enum: [google, line, amazon, twitter]
          description: "소셜 플랫폼"
        linkedAt:
          type: string
          format: date-time
          description: "연동 일시"

    SocialLinkRequest:
      type: object
      required:
        - code
      description: "소셜 연동 완료 요청 — OAuth 성공 후 받은 임시 코드"
      properties:
        code:
          type: string
          description: "linkCode (5분 유효, 1회용)"

    WithdrawRequest:
      type: object
      required:
        - currentPassword
      description: "회원 탈퇴 요청 (비밀번호 재확인)"
      properties:
        currentPassword:
          type: string
          description: "현재 비밀번호"
