components:
  schemas:
    LogInResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
          description: "액세스 토큰 (1시간)"
        refreshToken:
          type: string
          description: "리프레시 토큰 (7일)"
        user:
          $ref: "#/components/schemas/UserData"

    RegisterResponse:
      type: object
      properties:
        message:
          type: string
          description: "처리 결과 메시지"
        userId:
          type: integer
          format: int64
          description: "생성된 유저 ID"

    UserData:
      type: object
      required:
        - uid
        - nickname
        - avatarUrl
        - statusMessage
        - createdAt
        - updatedAt
      properties:
        uid:
          type: integer
          format: int64
          description: "유저 ID"
        nickname:
          type: string
          description: "유저 닉네임"
        email:
          type: string
          nullable: true
          description: "로그인 계정 이메일(아이디)"
        avatarUrl:
          type: string
          nullable: true
          description: "프로필 이미지 URL"
        statusMessage:
          type: string
          nullable: true
          description: "상태 메시지"
        language:
          type: string
          nullable: true
          description: "선호 언어 (ko | ja)"
        createdAt:
          type: string
          format: date-time
          description: "생성일시"
        updatedAt:
          type: string
          format: date-time
          description: "수정일시"

    SocialAccountResponse:
      type: object
      description: "연동된 소셜 계정 정보 (계정당 1개, 미연동이면 data가 null)"
      properties:
        provider:
          type: string
          enum: [ google, line, amazon, twitter ]
          description: "소셜 플랫폼"
        linkedAt:
          type: string
          format: date-time
          description: "연동 일시"