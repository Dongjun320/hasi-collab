components:
  schemas:
    ChannelCreateRequest:
      type: object
      required:
        - name
        - isPrivate
      description: "채널 생성 시 요청"
      properties:
        name:
          type: string
          maxLength: 100
          description: "채널 이름"
        isPrivate:
          type: boolean
          description: "공개/비공개"
        parentId:
          type: integer
          format: int64
          nullable: true
          description: "상위 채널 ID (NULL이면 최상위 채널)"

    ChannelPatchRequest:
      type: object
      description: "채널 부분수정 시 요청"
      properties:
        name:
          type: string
          maxLength: 100
          description: "채널 이름"
        isPrivate:
          type: boolean
          description: "공개/비공개"