components:
  schemas:

    # 공통 에러 응답 구조 정립했습니다 - PM
    ErrorResponse:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
          example: null
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: "에러 코드"
              example: "AUTH_001"
            message:
              type: string
              description: "클라이언트에 표시할 메시지"
              example: "이메일 또는 비밀번호가 틀렸습니다"

    # ── AUTH 에러 ────────────────────────────────────────────────────

    Auth001Error:
      description: "AUTH_001 | 401 | 이메일 또는 비밀번호 오류"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "AUTH_001"
          message: "이메일 또는 비밀번호가 틀렸습니다"

    Auth002Error:
      description: "AUTH_002 | 403 | 이메일 미인증 상태로 로그인"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "AUTH_002"
          message: "이메일 인증이 필요합니다"

    Auth003Error:
      description: "AUTH_003 | 401 | 토큰 만료 / 잘못된 토큰"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "AUTH_003"
          message: "토큰이 만료되었습니다"

    Auth004Error:
      description: "AUTH_004 | 403 | 접근 권한 없음"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "AUTH_004"
          message: "접근 권한이 없습니다"

    Auth005Error:
      description: "AUTH_005 | 409 | 이미 사용 중인 이메일"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "AUTH_005"
          message: "이미 사용 중인 이메일입니다"

    Auth006Error:
      description: "AUTH_006 | 404 | 가입되지 않은 이메일"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "AUTH_006"
          message: "가입되지 않은 이메일입니다"

    # ── VERIFY 에러 ──────────────────────────────────────────────────

    Verify001Error:
      description: "VERIFY_001 | 400 | 인증코드 오류 / 만료"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "VERIFY_001"
          message: "코드가 틀렸거나 만료되었습니다"

    # ── VALID 에러 ───────────────────────────────────────────────────

    Valid001Error:
      description: "VALID_001 | 400 | 입력값 검증 실패 — message를 입력 필드 하단에 표시"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "VALID_001"
          message: "이메일 형식이 올바르지 않습니다"

    # ── SERVER 에러 ───────────────────────────────────────────────────

    Server001Error:
      description: "SERVER_001 | 500 | 서버 내부 오류"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "SERVER_001"
          message: "서버 내부 오류가 발생하였습니다"

    # ── WORKSPACE 에러 ───────────────────────────────────────────────────

    WS001Error:
      description: "WS_001 | 409 | 이미 사용중인 워크스페이스"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "WS_001"
          message: "동일한 이름의 워크스페이스가 존재합니다"

    WS002Error:
      description: "WS_002 | 404 | 찾을 수 없는 워크스페이스"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "WS_002"
          message: "워크스페이스를 찾을 수 없습니다"

    WS003Error:
      description: "WS_003 | 400 | 유효하지 않은 워크스페이스 입력값"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "WS_003"
          message: "워크스페이스 입력값이 유효하지 않습니다"


    # ── CHANNEL 에러 ───────────────────────────────────────────────────

    CH001Error:
      description: "CH_001 | 409 | 이미 사용중인 채널"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "CH_001"
          message: "동일한 이름의 채널이 존재합니다"

    CH002Error:
      description: "CH_002 | 404 | 찾을 수 없는 채널"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "CH_002"
          message: "채널을 찾을 수 없습니다"
          
    CH003Error:
      description: "CH_003 | 400 | 유효하지 않은 채널 입력값"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "CH_003"
          message: "채널 입력값이 유효하지 않습니다"

    # ── MEMBER 에러 ───────────────────────────────────────────────────

    MBR001Error:
      description: "MBR_001 | 404 | 찾을 수 없는 닉네임의 사용자"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "MBR_001"
          message: "해당 닉네임의 사용자를 찾을 수 없습니다"
          
    MBR002Error:
      description: "MBR_002 | 409 | 이미 워크스페이스에 속한 멤버"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "MBR_002"
          message: "이미 워크스페이스에 속한 멤버입니다"
          
    MBR003Error:
      description: "MBR_003 | 404 | 찾을 수 없는 멤버"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "MBR_003"
          message: "멤버를 찾을 수 없습니다"
          
    MBR004Error:
      description: "MBR_004 | 400 | 유효하지 않은 멤버 입력값"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "MBR_004"
          message: "멤버 입력값이 유효하지 않습니다"

    MBR005Error:
      description: "MBR_005 | 404 | 찾을 수 없는 워크스페이스 또는 채널 또는 멤버"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "MBR_005"
          message: "워크스페이스 또는 채널 또는 멤버를 찾을 수 없습니다"

    MBR006Error:
      description: "MBR_005 | 404 | 찾을 수 없는 초대"
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
      example:
        success: false
        data: null
        error:
          code: "MBR_006"
          message: "초대를 찾을 수 없습니다"