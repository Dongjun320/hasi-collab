components:
  schemas:
    FriendResponse:
      type: object
      description: "친구 정보"
      properties:
        id:
          type: integer
          format: int64
          description: "friends 테이블의 관계 id (accept/reject/remove 시 사용)"
        uid:
          type: integer
          format: int64
          description: "친구(상대방)의 유저 id"
        name:
          type: string
          maxLength: 50
          description: "친구 닉네임"
        statusMessage:
          type: string
          nullable: true
          maxLength: 100
          description: "상태 메시지"