type: object
required:
  - uid
  - email
  - password
  - nickname
  - status_code
description: ""
properties:
  uid:
    type: integer
    description: "사용자 UID"
  email:
    type: string
    description: "로그인 이메일(아이디)"
  password:
    type: string
    description: "소셜 로그인 시 NULL 허용"
  nickname:
    type: string
    description: "표시 이름"
  avatar_url:
    type: string
    description: "프로필 이미지 URL"
  status_code:
    type: string
    description: "online/away/busy/offline/outside/remote"
  status_message:
    type: string
    description: "상태 메시지"
  dnd_start_time:
    type: string
    description: "DND 시작 시각"
  dnd_end_time:
    type: string
    description: "DND 종료 시각"
  dept_id:
    type: integer
    description: "소속 부서"
  is_active:
    type: boolean
    description: "계정 활성 여부"
  is_admin:
    type: boolean
    description: "시스템 관리자 여부"
  created_at:
    type: string
    description: "유저 생성 date"
  updated_at:
    type: string
    description: "유저 정보 수정 시각"
