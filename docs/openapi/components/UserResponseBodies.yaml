components:
  schemas:
    UserSearchResponse:
      type: object
      description: "닉네임 검색 결과"
      properties:
        uid:
          type: integer
          format: int64
          description: "유저 ID"
        nickname:
          type: string
          maxLength: 50
          description: "유저 닉네임"

    MemoResponse:
      type: object
      description: "유저 메모 응답"
      properties:
        content:
          type: string
          nullable: true
          description: "메모 내용 (없으면 null)"