components:
  schemas:
    WorkspaceCreateRequest:
      type: object
      required:
        - name
        - isPrivate
      description: "워크스페이스 생성 시 요청"
      properties:
        name:
          type: string
          maxLength: 100
          description: "워크스페이스 이름"
        isPrivate:
          type: boolean
          description: "공개/비공개"
        description:
          type: string
          maxLength: 255
          nullable: true
          description: "워크스페이스 설명"
        iconUrl:
          type: string
          maxLength: 512
          nullable: true
          description: "워크스페이스 대표 이미지"


    WorkspacePatchRequest:
      type: object
      description: "워크스페이스 부분수정 시 요청"
      properties:
        name:
          type: string
          maxLength: 100
          description: "워크스페이스 이름"
        isPrivate:
          type: boolean
          description: "공개/비공개"
        description:
          type: string
          maxLength: 255
          nullable: true
          description: "워크스페이스 설명"
        iconUrl:
          type: string
          maxLength: 512
          nullable: true
          description: "워크스페이스 대표 이미지"
        defaultChannelId:
          type: integer
          format: int64
          description: "워크스페이스 대표(기본) 채널"

    WorkspacePermissionsPatchRequest:
      type: object
      required:
        - permissions
      description: "워크스페이스 권한 수정 시 요청"
      properties:
        permissions:
          type: array
          items:
            type: object
            required:
              - permission
              - adminAllowed
            properties:
              permission:
                type: string
                enum:
                  - EDIT_WORKSPACE
                  - DELETE_WORKSPACE
                  - INVITE_WORKSPACE_MEMBER
                  - REMOVE_WORKSPACE_MEMBER
                  - EDIT_WORKSPACE_MEMBER_ROLE
                  - CREATE_CHANNEL
                  - EDIT_CHANNEL
                  - DELETE_CHANNEL
                  - INVITE_CHANNEL_MEMBER
                  - REMOVE_CHANNEL_MEMBER
                  - EDIT_CHANNEL_MEMBER_ROLE
                description: "권한 종류"
              adminAllowed:
                type: boolean
                description: "ADMIN 허용 여부"
