openapi: 3.0.0
info:
  title: Service
  description: Service는 Authentication/Authorization, RESTful API, DB와의 연결 등을 처리하는 백엔드 서비스입니다.
  version: 1.0.0

security:
  - BearerAuth: []

paths:
  /api/auth/register:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1register"

  /api/auth/email/send:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1email~1send"

  /api/auth/email/verify:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1email~1verify"

  /api/auth/password/send:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1password~1send"

  /api/auth/password/verify:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1password~1verify"

  /api/auth/login:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1login"

  /api/auth/logout:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1logout"

  /api/auth/password/reset:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1password~1reset"

  /api/workspaces:
    $ref: "./paths/workspaceEndpoints.yaml#/paths/~1api~1workspaces"

  /api/workspaces/me:
    $ref: "./paths/workspaceEndpoints.yaml#/paths/~1api~1workspaces~1me"

  /api/workspaces/{workspaceId}:
    $ref: "./paths/workspaceEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}"

  /api/workspaces/search:
    $ref: "./paths/workspaceEndpoints.yaml#/paths/~1api~1workspaces~1search"

  /api/workspaces/{workspaceId}/channels:
    $ref: "./paths/channelEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1channels"

  /api/workspaces/{workspaceId}/channels/{channelId}:
    $ref: "./paths/channelEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1channels~1{channelId}"

  /api/workspaces/{workspaceId}/members:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1members"

  /api/workspaces/{workspaceId}/members/me:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1members~1me"

  /api/workspaces/{workspaceId}/members/{userId}:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1members~1{userId}"

  /api/workspaces/{workspaceId}/channels/{channelId}/members:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1channels~1{channelId}~1members"

  /api/workspaces/{workspaceId}/channels/{channelId}/members/me:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1channels~1{channelId}~1members~1me"

  /api/workspaces/{workspaceId}/channels/{channelId}/members/{userId}:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1channels~1{channelId}~1members~1{userId}"

  /api/workspaces/{workspaceId}/boards:
    $ref: "./paths/boardEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1boards"

  /api/workspaces/{workspaceId}/boards/{boardId}/tasks:
    $ref: "./paths/boardEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1boards~1{boardId}~1tasks"

  /api/workspaces/{workspaceId}/boards/{boardId}/tasks/{taskId}:
    $ref: "./paths/boardEndpoints.yaml#/paths/~1api~1workspaces~1{workspaceId}~1boards~1{boardId}~1tasks~1{taskId}"

  /api/invitations/sent:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1invitations~1sent"

  /api/invitations/received:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1invitations~1received"

  /api/invitations/{invitationId}:
    $ref: "./paths/memberEndpoints.yaml#/paths/~1api~1invitations~1{invitationId}"

  /api/friends:
    $ref: "./paths/friendEndpoints.yaml#/paths/~1api~1friends"

  /api/friends/{friendId}:
    $ref: "./paths/friendEndpoints.yaml#/paths/~1api~1friends~1{friendId}"

  /api/friends/requests/{receiverId}:
    $ref: "./paths/friendEndpoints.yaml#/paths/~1api~1friends~1requests~1{receiverId}"

  /api/friends/requests/received:
    $ref: "./paths/friendEndpoints.yaml#/paths/~1api~1friends~1requests~1received"

  /api/friends/requests/sent:
    $ref: "./paths/friendEndpoints.yaml#/paths/~1api~1friends~1requests~1sent"

  /api/friends/requests/{requestId}/accept:
    $ref: "./paths/friendEndpoints.yaml#/paths/~1api~1friends~1requests~1{requestId}~1accept"

  /api/friends/requests/{requestId}/reject:
    $ref: "./paths/friendEndpoints.yaml#/paths/~1api~1friends~1requests~1{requestId}~1reject"

  /api/users/search:
    $ref: "./paths/userEndpoints.yaml#/paths/~1api~1users~1search"

  /api/users/me:
    $ref: "./paths/userEndpoints.yaml#/paths/~1api~1users~1me"

  /api/auth/social:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1social"

  /api/auth/social/link:
    $ref: "./paths/authEndpoints.yaml#/paths/~1api~1auth~1social~1link"

  /api/users/me/nickname:
    $ref: "./paths/userEndpoints.yaml#/paths/~1api~1users~1me~1nickname"

  /api/users/me/status-message:
    $ref: "./paths/userEndpoints.yaml#/paths/~1api~1users~1me~1status-message"



components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  

