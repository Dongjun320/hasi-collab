    post:
      summary: "로그인 성공 시 accessToken(1h) + refreshToken(7d) 발급."
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/MessageRequestBodies.yaml"
      responses:
        '200':
          description: "로그인 성공"
          content:
            application/json:
              schema:
                $ref: "../components/MessageRequestBodies.yaml"
        '401':
          description: "이메일 혹은 pw 틀림"
  /api/auth/logout:
    post: