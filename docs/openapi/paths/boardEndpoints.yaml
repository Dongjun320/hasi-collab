        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

    post:
      summary: "태스크 생성"
      description: "워크스페이스 OWNER·부서장만 가능"
      tags:
        - Board
      operationId: createTask
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/TaskCreateRequest"
      responses:
        '201':
          description: "태스크 생성 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/TaskCreateResponse"
        '400':
          description: "Bad Request, 필수 필드 누락"
          content:
            application/json:
