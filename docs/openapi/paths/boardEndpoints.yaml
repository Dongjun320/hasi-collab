          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 태스크 생성 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 보드가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

  /api/workspaces/{workspaceId}/boards/{boardId}/tasks/{taskId}:
    put:
      summary: "태스크 수정 (상태 변경, 담당자 변경, 칸반 이동 포함)"
      description: |
        OWNER·부서장은 전체 필드 수정 가능.
        담당자 본인은 status만 변경 가능(칸반 이동), 그 외 필드 포함 시 403
      tags:
        - Board
      operationId: updateTask
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/TaskUpdateRequest"
      responses:
