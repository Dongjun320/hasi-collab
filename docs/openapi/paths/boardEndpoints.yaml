    post:
      summary: "보드 부서원 추가"
      description: "워크스페이스 OWNER·부서장만 가능. 대상은 해당 워크스페이스 멤버여야 함"
      tags:
        - Board
      operationId: addBoardMember
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/BoardMemberAddRequest"
      responses:
        '201':
          description: "부서원 추가 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardMemberAddResponse"
        '400':
          description: "Bad Request, 워크스페이스 멤버가 아니거나 이미 추가된 사용자"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS003Error"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 부서원 추가 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 보드가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

  /api/workspaces/{workspaceId}/boards/{boardId}/members/{userId}:
    delete:
      summary: "보드 부서원 제외"
      description: "워크스페이스 OWNER·부서장만 가능"
      tags:
        - Board
      operationId: removeBoardMember
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "부서원 제외 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardMemberRemoveResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 부서원 제외 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 보드 또는 부서원이 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

