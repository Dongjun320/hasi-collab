          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "부서원 목록 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardMemberListResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
