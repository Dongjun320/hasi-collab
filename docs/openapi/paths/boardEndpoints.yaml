          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 수정 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 태스크가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

    delete:
      summary: "태스크 삭제"
      description: "워크스페이스 OWNER·부서장만 가능"
      tags:
        - Board
      operationId: deleteTask
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "태스크 삭제 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/TaskDeleteResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 삭제 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
