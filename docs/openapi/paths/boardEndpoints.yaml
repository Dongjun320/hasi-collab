paths:
  /api/workspaces/{workspaceId}/boards:
    get:
      summary: "보드 목록 조회"
      description: |
        접근 가능한 보드만 반환.
        워크스페이스 OWNER = 전체 / 부서장(board.ownerId) = 본인 보드 / MEMBER = BoardMember로 등록된 보드
      tags:
        - Board
      operationId: listBoards
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "보드 목록 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardListResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 워크스페이스 멤버가 아님"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 워크스페이스가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

    post:
      summary: "보드 생성"
      description: "워크스페이스 OWNER만 가능. ownerId 생략 시 생성자 본인이 부서장"
      tags:
        - Board
      operationId: createBoard
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/BoardCreateRequest"
      responses:
        '201':
          description: "보드 생성 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardCreateResponse"
        '400':
          description: "Bad Request, 필수 필드 누락 또는 ownerId가 ADMIN이 아님"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS003Error"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 워크스페이스 OWNER가 아님"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

  /api/workspaces/{workspaceId}/boards/{boardId}:
    patch:
      summary: "보드 수정 (이름 변경, 부서장 교체)"
      description: "이름 변경은 OWNER·부서장 / 부서장 교체(ownerId)는 워크스페이스 OWNER만 가능"
      tags:
        - Board
      operationId: updateBoard
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/BoardUpdateRequest"
      responses:
        '200':
          description: "보드 수정 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardUpdateResponse"
        '400':
          description: "Bad Request, 유효하지 않은 값"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS003Error"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 수정 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 보드가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

    delete:
      summary: "보드 삭제"
      description: "워크스페이스 OWNER·부서장만 가능. 하위 태스크·부서원도 함께 삭제"
      tags:
        - Board
      operationId: deleteBoard
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "보드 삭제 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardDeleteResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 삭제 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 보드가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

  /api/workspaces/{workspaceId}/boards/{boardId}/members:
    get:
      summary: "보드 부서원 목록 조회"
      tags:
        - Board
      operationId: listBoardMembers
      parameters:
