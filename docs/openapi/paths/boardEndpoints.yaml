paths:
  /api/workspaces/{workspaceId}/boards:
    get:
      summary: "보드 목록 조회"
      tags:
        - Board
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "보드 목록 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardListResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '404':
          description: "Not Found, 워크스페이스가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

    post:
      summary: "보드 생성"
      tags:
        - Board
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/BoardCreateRequest"
      responses:
        '201':
          description: "보드 생성 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/BoardCreateResponse"
        '400':
          description: "Bad Request, 필수 필드 누락"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS003Error"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

  /api/workspaces/{workspaceId}/boards/{boardId}/tasks:
    get:
      summary: "태스크 목록 조회"
      tags:
        - Board
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "태스크 목록 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/TaskListResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '404':
          description: "Not Found, 보드가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

    post:
      summary: "태스크 생성"
      tags:
        - Board
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/TaskCreateRequest"
      responses:
        '201':
          description: "태스크 생성 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/TaskCreateResponse"
        '400':
          description: "Bad Request, 필수 필드 누락"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS003Error"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

  /api/workspaces/{workspaceId}/boards/{boardId}/tasks/{taskId}:
    put:
      summary: "태스크 수정 (상태 변경, 담당자 변경, 칸반 이동 포함)"
      tags:
        - Board
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/BoardRequestBodies.yaml#/components/schemas/TaskUpdateRequest"
      responses:
        '200':
          description: "태스크 수정 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/TaskUpdateResponse"
        '400':
          description: "Bad Request, 유효하지 않은 값"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS003Error"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 수정 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 태스크가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"

    delete:
      summary: "태스크 삭제"
      tags:
        - Board
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "태스크 삭제 성공"
          content:
            application/json:
              schema:
                $ref: "../components/BoardResponseBodies.yaml#/components/schemas/TaskDeleteResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 삭제 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 태스크가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"
