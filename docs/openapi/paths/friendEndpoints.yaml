paths:
  /api/friends:
    get:
      summary: "친구 목록 조회"
      tags:
        - Friend
      operationId: getFriends
      responses:
        '200':
          description: "조회 성공"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "../components/FriendResponseBodies.yaml#/components/schemas/FriendResponse"
        '401':
          description: "인증 실패"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"

  /api/friends/{friendId}:
    post:
      summary: "친구 추가"
      tags:
        - Friend
      operationId: addFriend
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "추가할 친구의 유저 ID"
      responses:
        '200':
          description: "추가 성공"
        '400':
          description: "자기 자신을 친구로 추가하려 함"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '409':
          description: "이미 친구인 사용자"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"

    delete:
      summary: "친구 삭제"
      tags:
        - Friend
      operationId: removeFriend
      parameters:
        - name: friendId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: "삭제할 친구의 유저 ID"
      responses:
        '200':
          description: "삭제 성공"