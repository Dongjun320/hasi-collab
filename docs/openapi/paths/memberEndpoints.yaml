            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '409':
          description: "Conflict, 충돌하는 값이 존재함"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
    delete:
      summary: "워크스페이스 멤버 추방"
