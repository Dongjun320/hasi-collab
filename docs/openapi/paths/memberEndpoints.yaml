  /api/workspaces/{workspaceId}/members:
    post:
      summary: "닉네임 이용 워크스페이스로 멤버 초대"
      tags:
        - WorkspaceMember
      operationId: inviteWorkspaceMember
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/MemberRequestBodies.yaml#/components/schemas/WorkspaceMemberInviteRequest"
      responses:
        '200':
          description: "멤버 초대 성공"
          content:
            application/json:
              schema:
                $ref: "../components/MemberResponseBodies.yaml#/components/schemas/WorkspaceMemberInviteResponse"
        '400':
          description: "Bad Request, 유효하지 않은 닉네임 형식"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/MBR004Error"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 멤버 초대 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '409':
          description: "Conflict, 이미 워크스페이스에 속한 멤버"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/MBR002Error"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"
    get:
      summary: "워크스페이스 멤버 조회"
      tags:
        - WorkspaceMember
      operationId: getWorkspaceMembers
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "멤버 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/MemberResponseBodies.yaml#/components/schemas/WorkspaceMemberListResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth003Error"
        '403':
          description: "Forbidden, 조회 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Auth004Error"
        '404':
          description: "Not Found, 워크스페이스가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/WS002Error"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/Server001Error"
    
