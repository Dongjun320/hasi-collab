          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '404':
          description: "Not Found, 워크스페이스 또는 멤버가 존재하지 않음"
          content:
            application/json:
              schema:
