            type: integer
            format: int64
      responses:
        '200':
          description: "워크스페이스 멤버 추방 성공"
          content:
            application/json:
              schema:
                $ref: "../components/MemberResponseBodies.yaml#/components/schemas/WorkspaceMemberRemoveResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '403':
