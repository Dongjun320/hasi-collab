paths:
  /api/workspaces/{workspaceId}/members:
    post:
      summary: "닉네임 이용 워크스페이스로 멤버 초대"
      tags:
        - WorkspaceMember
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/MemberRequestBodies.yaml#/components/schemas/WorkspaceMemberInviteRequest"
      responses:
        '200':
          description: "멤버 초대 성공"
          content:
            application/json:
              schema:
                $ref: "../components/MemberResponseBodies.yaml#/components/schemas/WorkspaceMemberInviteResponse"
        '400':
          description: "Bad Request, 유효하지 않은 닉네임 형식"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '403':
          description: "Forbidden, 멤버 초대 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '409':
          description: "Conflict, 이미 워크스페이스에 속한 멤버"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
    get:
      summary: "워크스페이스 멤버 조회"
      tags:
        - WorkspaceMember
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "멤버 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/MemberResponseBodies.yaml#/components/schemas/WorkspaceMemberListResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '403':
          description: "Forbidden, 조회 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '404':
          description: "Not Found, 워크스페이스가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
    
  /api/workspaces/{workspaceId}/members/me:
    delete:
      summary: "워크스페이스 멤버 자진탈퇴"
      tags:
        - WorkspaceMember
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "워크스페이스 탈퇴 성공"
          content:
            application/json:
              schema:
                $ref: "../components/MemberResponseBodies.yaml#/components/schemas/WorkspaceMemberLeaveResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '403':
          description: "Forbidden, 탈퇴 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '404':
          description: "Not Found, 워크스페이스 또는 멤버가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"

  /api/workspaces/{workspaceId}/members/{userId}:
