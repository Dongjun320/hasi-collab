paths:
  /api/workspaces:
    post:
      summary: "워크스페이스 생성"
      tags:
        - Workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/WorkspaceRequestBodies.yaml#/components/schemas/WorkspaceCreateRequest"
      responses:
        '201':
          description: "워크스페이스 생성 성공"
          content:
            application/json:
              schema:
                $ref: "../components/WorkspaceResponseBodies.yaml#/components/schemas/WorkspaceCreateResponse"
        '400':
          description: "Bad Request, 워크스페이스 이름 누락, 길이 제한 초과, 필수 필드 누락"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '401':
          description: "Unauthorized, 로그인 하지 않은 상태에서 워크스페이스 생성 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '409':
          description: "Conflict, 동일한 이름의 워크스페이스가 존재함"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, DB 저장 중 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"

  /api/workspaces/me:
    get:
      summary: "로그인 후 자기가 속한 워크스페이스 목록 조회, 사이드바 렌더링에 사용"
      tags:
        - Workspace
      responses:
        '200':
          description: "로그인 후 자기가 속한 워크스페이스 목록 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/WorkspaceResponseBodies.yaml#/components/schemas/WorkspaceGetResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
         
  /api/workspaces/{workspaceId}:
    patch:
      summary: "워크스페이스 부분 수정"
      tags:
        - Workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "../components/WorkspaceRequestBodies.yaml#/components/schemas/WorkspacePatchRequest"
      responses:
        '200':
          description: "워크스페이스 부분 수정 성공"
          content:
            application/json:
              schema:
                $ref: "../components/WorkspaceResponseBodies.yaml#/components/schemas/WorkspacePatchResponse"
        '400':
          description: "Bad Request, 유효하지 않은 값"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '403':
          description: "Forbidden, 해당 워크스페이스 수정 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '404':
          description: "Not Found, 워크스페이스가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '409':
          description: "Conflict, 동일한 이름의 워크스페이스가 존재함"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
    delete:
      summary: "워크스페이스 삭제"
      tags:
        - Workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "워크스페이스 삭제 성공"
          content:
            application/json:
              schema:
                $ref: "../components/WorkspaceResponseBodies.yaml#/components/schemas/WorkspaceDeleteResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '403':
          description: "Forbidden, 해당 워크스페이스 삭제 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '404':
          description: "Not Found, 워크스페이스가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"

  /api/workspaces/search:
    get:
      summary: "워크스페이스 목록 조회(내가 속한 + 공개 워크스페이스 커서 기반 조회)"
      tags:
        - Workspace
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "검색 키워드"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: "조회 개수"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: "커서 값"
      responses:
        '200':
          description: "워크스페이스 목록 조회 성공"
          content:
            application/json:
              schema:
                $ref: "../components/WorkspaceResponseBodies.yaml#/components/schemas/WorkspaceSearchResponse"
        '401':
          description: "Unauthorized, 인증되지 않은 요청"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '403':
          description: "Forbidden, 조회 권한 없음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '404':
          description: "Not Found, 워크스페이스가 존재하지 않음"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
        '500':
          description: "Internal Server Error, 서버 내부 오류"
          content:
            application/json:
              schema:
                $ref: "../components/ErrorResponseBodies.yaml#/components/schemas/ErrorResponse"
