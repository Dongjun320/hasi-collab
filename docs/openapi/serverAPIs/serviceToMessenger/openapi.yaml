openapi: 3.0.0
info:
  title: Service To Messenger
  description: Service에서 Messenger로의 Request입니다.
  version: 1.0.0
paths:
  /messenger-api/internal/channel-messages:
    $ref: "./paths/InternalMessageEndpoints.yaml#/paths/~1messenger-api~1internal~1channel-messages"

components:
  securitySchemes:
    # 서버 간 호출용 JWT. 사용자 토큰과 서명 키가 분리돼 있습니다
    # (messenger의 app.internal.jwt.secret != jwt.secret).
    #
    #   iss:  app.internal.jwt.issuer와 일치 (기본 "hasi-service")
    #   sub: 호출 서비스 이름. 로그에 남습니다
    #   scope: "internal" 고정. 사용자 토큰에는 없는 클레임입니다
    #   exp: ttl
    InternalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
