paths:
  /api/messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: "해당 유저가 들어가 있는 모든 채널/DM의 데이터 반환"
      tags:
        - Channel
      responses:
        '200':
          description: "메시지 Return"
          content:
            application/json:
              schema:
                $ref: "../components/MessageResponseBodies.yaml#/components/schemas/userChannels"

  /api/messages/channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: "채널별 특정 기간 내의 메시지 반환. 검색, 스크롤 등으로 과거 메시지 보기 등 위함"
      tags:
        - Channel
      # 패러미터 없을 시 기본적으로 CreatedAt 기준 1일치 반환.
      # 쿼리에 `/api/messages/channels/{id}?startDate=<시작일>` 식으로
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: "메시지 Return"
          content:
            application/json:
              schema:
                $ref: "../components/MessageResponseBodies.yaml#/components/schemas/refreshChannel"

